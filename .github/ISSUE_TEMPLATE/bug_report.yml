name: Bug report
description: Report a reproducible CompleteSaveInstance issue.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Include observable evidence. Remove credentials and private content from attachments.
  - type: input
    id: revision
    attributes:
      label: Source revision
      description: Tag or full commit SHA, and entry point used.
      placeholder: v0.2.0 / UltraCompleteSveInstance
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Runtime name/version, Roblox version, and operating system.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps on an experience you own or are authorized to test.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Exact options
      render: lua
      value: |
        local options = {
            Decompile = false,
            SaveBytecode = false,
            SafeMode = false,
            KillAllScripts = false,
            BoostFPS = false,
            ShutdownWhenDone = false,
            __DEBUG_MODE = true,
        }
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: File evidence and Studio result
      description: Actual output path, file existence, size, and Studio opening/error. Say if not checked.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant console messages
      description: Include final messages and exact property omission messages.
      render: text
